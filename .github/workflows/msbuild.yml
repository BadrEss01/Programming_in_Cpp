name: C++ example smoke check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile introductory example
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Wextra -pedantic a9/a9_1.cpp -o build/a9_1
      - name: Check echo behavior
        run: |
          printf 'robotics\n' | ./build/a9_1 > build/output.txt
          grep -q robotics build/output.txt
